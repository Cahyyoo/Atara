# Builds the Android app and publishes it to GitHub Releases, where installed
# apps look for updates. Runs when a tag such as mobile-v1.1.0 is pushed; the
# tag's message becomes the notes people see in the update dialog.
# Setup and rollout: see "Rilis & pembaruan otomatis" in mobile/README.md.
name: Mobile release

on:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # A build without these would quietly fall back to the debug key, and no
      # device could ever install anything published after it.
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::error::Signing secrets are missing; refusing to publish."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6

      - name: Analyze
        run: flutter analyze

      # Without test/stress: those measure timing and are not reliable on a
      # machine that is busy with something else.
      - name: Test
        run: flutter test $(find test -name '*_test.dart' -not -path 'test/stress/*')

      - name: Restore the release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$PASSWORD"
          } > android/key.properties

      # The build number only ever rises, so pubspec.yaml needs no bump. The
      # offset keeps it above the 1 that builds from before this workflow carry.
      - name: Build
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name "${GITHUB_REF_NAME#mobile-v}" \
            --build-number "$((100 + GITHUB_RUN_NUMBER))"
          cp build/app/outputs/flutter-apk/app-release.apk atara-lab.apk

      # The checkout turns an annotated tag into a plain one, and loses its
      # message, unless the tag is fetched again.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          VERSION="${GITHUB_REF_NAME#mobile-v}"
          jq -n \
            --arg versionName "$VERSION" \
            --argjson versionCode "$((100 + GITHUB_RUN_NUMBER))" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/atara-lab.apk" \
            --arg sha256 "$(sha256sum atara-lab.apk | cut -d ' ' -f 1)" \
            --argjson size "$(stat -c %s atara-lab.apk)" \
            --arg notes "$NOTES" \
            '{versionName: $versionName, versionCode: $versionCode, url: $url, sha256: $sha256, size: $size, notes: $notes}' \
            > atara-update.json
          gh release create "$GITHUB_REF_NAME" atara-lab.apk atara-update.json \
            --title "Atara Lab $VERSION" \
            --notes "$NOTES" \
            --latest
